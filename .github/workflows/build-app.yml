name: 构建 Player Tauri 桌面版本
on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-pre-release:
    name: 删除预发布版本的构建产物
    runs-on: ubuntu-latest
    steps:
      - name: 删除预发布版本的构建产物
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          assets: |
            *.*
          tag: ${{ github.ref_name }}-player-dev
          fail-if-no-assets: false
          fail-if-no-release: false

  # NCM 协议层（src-tauri/crates/ncm-core）的守卫。
  #
  # 与平台无关，所以单独跑一次而不是塞进 6 个构建 job 里各拉一遍 15 MB 上游包。
  # ncm-core 已经是 gmplayer 的依赖、产物会进安装包，所以它是构建的 needs 前置：
  # 协议层过期或 shim 回归时，宁可不出包。
  verify-ncm-protocol:
    name: 校验 NCM 协议层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ncm-core

      - name: 安装依赖
        run: pnpm install

      # js/ncm-protocol.js 是入库产物（让 `cargo build` 不依赖 Node）。这一步
      # 保证它和 scripts/build-ncm-protocol.mjs 的输出逐字节一致——否则改了打包
      # 脚本却忘了重新生成，构建照样通过但发出去的是旧协议层。
      - name: 校验协议层产物与打包脚本同步
        run: pnpm check:ncm-protocol

      # shim 层（Buffer / URLSearchParams / node:crypto）的行为直接决定上线报文。
      # 这些是「本地静默错、只能靠服务器拒绝才发现」的一类 bug，必须离线钉住。
      - name: 运行 ncm-core 离线测试
        run: cargo test -p ncm-core --manifest-path src-tauri/Cargo.toml

  build-tauri-desktop:
    name: 构建 Tauri 桌面版本
    needs: [clean-pre-release, verify-ncm-protocol]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            name: linux
            arch: x86_64
            artifact_name_suffix: linux-x64
            package_extension: tar.gz
            os_runner: ubuntu-latest
          - platform: windows-latest
            args: ""
            name: windows
            arch: x86_64
            artifact_name_suffix: windows-x64
            package_extension: zip
            os_runner: windows-latest
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            name: windows
            arch: aarch64
            artifact_name_suffix: windows-arm64
            package_extension: zip
            os_runner: windows-latest
          - platform: macos-latest # arm64 二进制包
            args: "--target aarch64-apple-darwin"
            name: macOS
            arch: aarch64
            artifact_name_suffix: macos-arm64
            package_extension: tar.gz
            os_runner: macos-14
          - platform: macos-latest # x86 二进制包
            args: "--target x86_64-apple-darwin"
            name: macOS
            arch: x86_64
            artifact_name_suffix: macos-x64
            package_extension: tar.gz
            os_runner: macos-latest
          # - platform: macos-latest # 通用二进制包
          #   args: "--target universal-apple-darwin"
          #   name: macOS
          #   arch: universal

    runs-on: ${{ matrix.os_runner }}
    env:
      BUILDER_REPO: apoint123/ffmpeg-builder
      FFMPEG_VERSION_TAG: "7.1"

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: |
            wasm32-unknown-unknown,${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'windows-latest' && matrix.arch == 'aarch64') && 'aarch64-pc-windows-msvc' || '' }}

      - name: 安装系统依赖 (仅 Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libappindicator3-dev \
            libssl-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            curl \
            libasound2-dev \
            libdbus-1-dev \
            unzip \
            tar

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          key: ${{ matrix.artifact_name_suffix }}

      # macOS 自带的 Xcode LLVM 不支持 WASM 目标
      - name: "macOS: 安装 LLVM 和 Clang"
        uses: KyleMayes/install-llvm-action@v2
        if: matrix.platform == 'macos-latest'
        with:
          version: "20"

      - name: "macOS: 设置环境变量"
        if: matrix.platform == 'macos-latest'
        run: |
          SDK_PATH=$(xcrun --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH" >> $GITHUB_ENV
        shell: bash

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: 安装依赖 (包含子依赖和 WASM)
        run: |
          pnpm build:wasm
          pnpm install

      - name: 生成开发构建版本号
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export PATH="/usr/bin:$PATH"
          fi
          node ./scripts/gen-dev-version.mjs

      - name: 构建前端产物
        run: |
          pnpm build

      # macOS 签名与公证（可选）。仅当仓库配置了对应 Secrets 时才导出环境变量：
      # - APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY 三者齐全时启用 Developer ID 签名
      #   （APPLE_SIGNING_IDENTITY 会覆盖 tauri.macos.conf.json 中的 ad-hoc "-" 签名）
      # - APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 三者齐全时额外启用公证 (notarization)
      # 未配置时回退到 tauri.macos.conf.json 的 ad-hoc 签名，
      # 用户首次打开需清除 quarantine（见 Release 说明）。
      - name: "macOS: 配置 Apple 签名与公证（可选）"
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_env() {
            local name="$1" value="$2"
            {
              echo "${name}<<__GMPLAYER_SECRET_EOF__"
              echo "$value"
              echo "__GMPLAYER_SECRET_EOF__"
            } >> "$GITHUB_ENV"
          }
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            set_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            set_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            set_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "已启用 Apple Developer ID 签名"
          else
            echo "未配置 Apple 签名 Secrets，使用 ad-hoc 签名"
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            set_env APPLE_ID "$APPLE_ID"
            set_env APPLE_PASSWORD "$APPLE_PASSWORD"
            set_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "已启用 Apple 公证 (notarization)"
          fi

      - name: 构建 Player 程序并发布自动构建
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}-player-dev
          includeUpdaterJson: true
          releaseName: GMPlayer ${{ github.ref_name }} branch development build
          releaseBody: |
            Latest ${{ github.ref_name }} branch development build.
            最新 ${{ github.ref_name }} 分支开发调试构建。
            Development version may be unstable and may not work properly, please only for test purpose.
            开发版本可能不稳定且可能无法正常工作，请仅用于测试目的。

            macOS: builds are not notarized by Apple yet. If macOS says the app "is damaged and can't be opened" / "无法打开", run:
            macOS: 构建暂未经过 Apple 公证。如果 macOS 提示"已损坏，无法打开"或"无法打开应用程序"，请在终端执行：
            `xattr -cr /Applications/GMPlayer.app`
            Then open the app again. (macOS 15+: you may also need System Settings → Privacy & Security → Open Anyway)
            然后重新打开应用。（macOS 15 及以上还可在 系统设置 → 隐私与安全性 → 仍要打开 中放行）

            Latest commits (最新提交): ${{ github.event.head_commit.message }}
          prerelease: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMPlayer ${{matrix.name}}-${{matrix.arch}}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/GMPlayer.exe
            src-tauri/target/**/release/GMPlayer
            src-tauri/target/**/release/app
            src-tauri/target/**/release/app.exe
            src-tauri/target/**/release/gmplayer.exe
            src-tauri/target/**/release/gmplayer
  build-tauri-android:
    name: 构建 Tauri 安卓移动版本
    needs: [clean-pre-release, verify-ncm-protocol]
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "24"
      ANDROID_NDK_VERSION: "27.2.12479018"
      OPENSSL_VERSION: "3.4.1"
      ANDROID_OPENSSL_DIR: ${{ github.workspace }}/.android-openssl

    steps:
      - uses: actions/checkout@v4
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      - name: 安装 PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "x86_64-unknown-linux-gnu,x86_64-linux-android,i686-linux-android,aarch64-linux-android,arm-linux-androideabi,armv7-linux-androideabi,thumbv7neon-linux-androideabi"

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: 安装 wasm32 目标
        run: rustup target add wasm32-unknown-unknown

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          key: android

      - name: 设置 Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # rquickjs-sys 只随包发桌面端的预生成 bindings（16 个 target，没有任何
      # *-linux-android），所以 Android 必须开 bindgen feature 现场生成。而 bindgen
      # 自己找不到 NDK 的 sysroot 和 clang resource dir，不显式指定就会以
      # `'stdbool.h' file not found` 失败——一个和 QuickJS 毫无关系的报错。
      #
      # ncm-core 是 gmplayer 的依赖，所以下面的 `tauri android build` 会为全部 4 个
      # ABI 编译它；这段配置是构建必需，不是备用。
      #
      # resource dir 的版本号随 NDK 变（NDK 27 是 clang 18，NDK 29 是 20），
      # 所以问 clang 要，不写死。
      - name: 配置 ncm-core (QuickJS) 的 Android bindgen 环境
        shell: bash
        run: |
          set -euo pipefail
          NDK_LLVM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          RESOURCE_INCLUDE="$("${NDK_LLVM}/bin/clang" -print-resource-dir)/include"
          SYSROOT="${NDK_LLVM}/sysroot"

          LIBCLANG_DIR=""
          for d in "${NDK_LLVM}/lib" "${NDK_LLVM}/lib64"; do
            if ls "${d}"/libclang.so* > /dev/null 2>&1; then
              LIBCLANG_DIR="$d"
              break
            fi
          done
          if [[ -z "${LIBCLANG_DIR}" ]]; then
            echo "找不到 NDK 内的 libclang，bindgen 无法运行" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=${LIBCLANG_DIR}" >> "$GITHUB_ENV"

          # clang 的 wrapper triple 和 rust target 不是一一对应：三个 arm 变体
          # 都编译到 armv7a-linux-androideabi。
          for pair in \
            "aarch64_linux_android:aarch64-linux-android" \
            "armv7_linux_androideabi:armv7a-linux-androideabi" \
            "thumbv7neon_linux_androideabi:armv7a-linux-androideabi" \
            "arm_linux_androideabi:armv7a-linux-androideabi" \
            "i686_linux_android:i686-linux-android" \
            "x86_64_linux_android:x86_64-linux-android"; do
            var="${pair%%:*}"
            triple="${pair##*:}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_${var}=--target=${triple}${ANDROID_API_LEVEL} --sysroot=${SYSROOT} -I${RESOURCE_INCLUDE}" >> "$GITHUB_ENV"
          done

      # 提前把 QuickJS 的交叉编译单独跑一次。完整的 android build 后面也会编到它，
      # 但那要先花几分钟装 OpenSSL、跑前端构建；bindgen 配错的话在这里失败，报错
      # 短、位置明确。
      #
      # CC/AR 只在这一步给：cc crate 猜不出 NDK 那个带 API 版本号的 wrapper 名
      # （aarch64-linux-android24-clang），而真正的 android build 走 cargo-ndk，
      # 它自己会设这些——所以不往 GITHUB_ENV 里塞，免得干扰主构建。
      - name: 交叉编译检查 ncm-core (Android arm64)
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API_LEVEL }}-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo check -p ncm-core --manifest-path src-tauri/Cargo.toml --release --target aarch64-linux-android

      - name: 安装 Android OpenSSL 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl perl tar

      - name: 缓存 Android OpenSSL
        id: cache-android-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_OPENSSL_DIR }}
          key: android-openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API_LEVEL }}

      - name: 构建 Android OpenSSL
        if: steps.cache-android-openssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export PATH="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"

          work_dir="${RUNNER_TEMP}/openssl-android"
          src_archive="${work_dir}/openssl.tar.gz"
          src_dir="${work_dir}/openssl-${OPENSSL_VERSION}"
          mkdir -p "${work_dir}" "${ANDROID_OPENSSL_DIR}"

          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o "${src_archive}"
          tar -xzf "${src_archive}" -C "${work_dir}"

          build_openssl() {
            local openssl_target="$1"
            local install_name="$2"
            local install_dir="${ANDROID_OPENSSL_DIR}/${install_name}"
            local build_dir="${work_dir}/build-${install_name}"

            rm -rf "${build_dir}" "${install_dir}"
            cp -a "${src_dir}" "${build_dir}"
            pushd "${build_dir}"
            ./Configure "${openssl_target}" -D__ANDROID_API__="${ANDROID_API_LEVEL}" no-shared no-tests no-ui-console --prefix="${install_dir}" --openssldir="${install_dir}/ssl"
            make -j"$(nproc)"
            make install_sw
            popd
          }

          build_openssl android-arm64 aarch64-linux-android
          build_openssl android-arm armv7-linux-androideabi
          build_openssl android-x86 i686-linux-android
          build_openssl android-x86_64 x86_64-linux-android

      - name: 配置 Android OpenSSL
        shell: bash
        run: |
          {
            echo "OPENSSL_STATIC=1"
            echo "OPENSSL_NO_PKG_CONFIG=1"
            echo "AARCH64_LINUX_ANDROID_OPENSSL_DIR=${ANDROID_OPENSSL_DIR}/aarch64-linux-android"
            echo "ARMV7_LINUX_ANDROIDEABI_OPENSSL_DIR=${ANDROID_OPENSSL_DIR}/armv7-linux-androideabi"
            echo "ARM_LINUX_ANDROIDEABI_OPENSSL_DIR=${ANDROID_OPENSSL_DIR}/armv7-linux-androideabi"
            echo "THUMBV7NEON_LINUX_ANDROIDEABI_OPENSSL_DIR=${ANDROID_OPENSSL_DIR}/armv7-linux-androideabi"
            echo "I686_LINUX_ANDROID_OPENSSL_DIR=${ANDROID_OPENSSL_DIR}/i686-linux-android"
            echo "X86_64_LINUX_ANDROID_OPENSSL_DIR=${ANDROID_OPENSSL_DIR}/x86_64-linux-android"
          } >> "$GITHUB_ENV"

      - name: 安装依赖 (包含子依赖和 WASM)
        run: |
          pnpm build:wasm
          pnpm install

      - name: 生成开发构建版本号
        run: |
          node ./scripts/gen-dev-version.mjs

      - name: 构建前端产物
        run: |
          pnpm build

      - name: 全局安装 Tauri CLI
        run: |
          pnpm add -g @tauri-apps/cli@latest

      - name: 构建 Player 安卓移动版程序
        env:
          CARGO_NDK_ANDROID_PLATFORM: ${{ env.ANDROID_API_LEVEL }}
        run: |
          export NDK_HOME=$ANDROID_NDK_HOME
          export JAVA_HOME=$JAVA_HOME_17_X64
          pnpm tauri android build --split-per-abi

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMPlayer Android Universal
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
