[package]
name = "now-playing-controls"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Log
#
# `log` feature on purpose: the host app installs a `log` logger
# (`tauri-plugin-log`) and never a `tracing` subscriber, and without this feature
# `tracing` drops every event on the floor. That is how the whole SMTC/MPRIS
# layer came to be invisible in `GMPlayer.log` — including
# `初始化媒体控件失败` and every `更新系统媒体…失败`, i.e. exactly the lines
# needed to tell a broken session from a working one.
tracing = { version = "0.1", features = ["log"] }

# Error & Serialize
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
discord-rich-presence = "1.0"
url = "2.5"

# Windows
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Media", "Storage_Streams", "Win32_System_WinRT"]

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"
tempfile = "3.24"

# macOS
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-media-player = "0.3"

# Clippy Lints
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
