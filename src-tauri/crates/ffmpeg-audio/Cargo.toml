[package]
name = "gmplayer-ffmpeg-audio"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Audio-only FFmpeg wrapper adapted from SPlayer-Dev/ffmpeg-audio"
repository = "https://github.com/SPlayer-Dev/ffmpeg-audio"

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
thiserror = "2"
libc = "0.2"
tracing = { version = "0.1", optional = true }
ffmpeg_audio_sys = { git = "https://github.com/SPlayer-Dev/ffmpeg-audio", rev = "fe78660bd7e3a231f70222f3da5f1eadc0db87ba" }
