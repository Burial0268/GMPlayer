[package]
name = "gmplayer-audio-backend"
version = "0.1.0"
edition = "2021"
description = "Audio player backend using Symphonia + rodio, inspired by AMLL player-core"
authors = ["GBCLStudio"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "gmplayer_audio_backend"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
audio-analysis = { path = "../audio-analysis" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
symphonia = { version = "0.5", default-features = false, features = [
  "mp3",
  "aac",
  "alac",
  "flac",
  "vorbis",
  "pcm",
  "isomp4",
  "ogg",
  "wav",
] }
# Rodio is used only for Decoder/Source. Disable its default playback and
# recording adapters: rodio 0.22 otherwise pulls CPAL 0.17, whose Linux output
# is ALSA-only. Native playback is handled below by CPAL 0.18's PulseAudio
# backend. Keep Symphonia enabled for reliable try_seek across formats.
rodio = { version = "0.22", default-features = false, features = ["symphonia-all"] }
# Direct CPAL dependency for explicit output-stream configuration. Declared
# per-target because the `realtime` feature means two unrelated things depending
# on the host — see the two `cpal` tables below. `resolver = "2"` at the
# workspace root is what keeps those feature sets from being unified across
# targets.
rustfft = "6"
parking_lot = "0.12"
rtrb = "0.3.4"
log = "0.4"
tauri = { version = "2" }
# `json` 只是启用 ureq 与 serde_json 的集成；serde_json 本来就在依赖里。
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
anyhow = "1"
tracing = "0.1"
tempfile = "3"
# Promotes the two audio producer threads. CPAL already depends on this for its
# own callback thread; `default-features = false` matches how CPAL declares it,
# which notably leaves the Linux RealtimeKit backend (and its libdbus build
# dependency) off. See `src/rt_priority.rs` for what that costs on Linux.
audio_thread_priority = { version = "0.35", default-features = false }

# Desktop CPAL. On Linux, prefer the shared PulseAudio protocol backend (also
# served by pipewire-pulse) and let CPAL fall back to ALSA when no sound server
# is available. Unlike the native PipeWire backend, this does not add a
# libpipewire development-package requirement to Linux/CI builds. Here
# `realtime` does what its name says: it promotes eligible WASAPI/ALSA callback
# threads. CoreAudio already owns callback scheduling.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio", "realtime"] }

# Android CPAL, deliberately without `realtime`. In CPAL's AAudio backend that
# feature is not a thread-priority knob at all — the only thing it changes is
# `performance_mode(LowLatency)` on the stream builder (plus a one-shot
# RealtimeDenied report from the first data callback). LOW_LATENCY hands us a
# one-to-two-burst device buffer, i.e. a ~2-4 ms callback deadline that no amount
# of software queue depth can cover, and Google's own guidance puts
# "previously generated music" players on POWER_SAVING rather than LOW_LATENCY.
# Without the feature the stream opens in AAUDIO_PERFORMANCE_MODE_NONE: a larger
# device buffer, real headroom for the xrun tuning in `output/platform/android.rs`
# to grow into, and the normal mixer path — which is also where device
# post-processing (MiSound, Dolby, AudioFX) lives. Our own producer threads are
# promoted by `audio_thread_priority` above, whose `rt_android` backend is not
# feature-gated, so nothing is lost here.
[target.'cfg(target_os = "android")'.dependencies]
cpal = "0.18"

# COM/WASAPI for `output/platform/windows.rs`: the output-device identity, the
# apartment policy, and the default-device watch. Deliberately the same major
# CPAL 0.18 builds, so both halves of the WASAPI code in this process speak one
# set of generated bindings and this declaration unifies into a copy that is
# already compiled. `PROPERTYKEY` moved into `Win32_Foundation`, so no extra
# feature is required.
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
]

# Not redundant with `windows` above, and not optional. `windows::core::implement`
# — which the `IMMNotificationClient` on `DefaultOutputNotifier` needs — expands
# to code that names `::windows_core` by absolute path, so the *using* crate must
# have it as a direct dependency; `windows` re-exporting it as `windows::core`
# does not satisfy a leading `::`. Without this the build fails with `cannot find
# windows_core in the crate root`, which names the macro nowhere. CPAL 0.18
# declares it in its own right for exactly the same reason, and pinning the same
# `0.62` is what keeps both crates' `IUnknownImpl` the same sealed trait rather
# than two incompatible copies of it.
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies.windows-core]
version = "0.62"

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
coreaudio-rs = { version = "0.11", default-features = false, features = [
  "core_audio",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
symphonia = { version = "0.5", default-features = false, features = [
  "mp3",
  "aac",
  "alac",
  "flac",
  "vorbis",
  "pcm",
  "isomp4",
  "ogg",
  "wav",
] }

# NOTE: Cargo only honours `[profile.*]` from the workspace root
# (`src-tauri/Cargo.toml`), which already sets opt-level = 3 + fat LTO for
# release. A `[profile.release]` here would be silently ignored, so it is
# intentionally omitted.

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
