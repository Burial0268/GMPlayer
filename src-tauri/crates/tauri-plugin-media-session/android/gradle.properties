# Standalone-build settings for the vendored plugin.
#
# Only read when this directory is built as its own Gradle project (which is
# how `:compileDebugKotlin` gets run to check the Kotlin half without a full
# `tauri android build`). When the app includes this as the
# `:tauri-plugin-media-session` module, Gradle reads the *root* project's
# properties instead, so nothing here can affect an app build.
android.useAndroidX=true
